# Builds the video worker image. There is no Docker on the machine this repo is
# written from, so the build happens here and lands in GHCR, which is what the
# RunPod template pulls.
name: worker

on:
  push:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The base image is large and the build adds torch-sized wheels on top; a
      # stock runner runs out of disk about two thirds of the way through.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trendswap-worker:latest
            ghcr.io/${{ github.repository_owner }}/trendswap-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
